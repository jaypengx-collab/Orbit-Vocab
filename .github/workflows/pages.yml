name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp cache-busting version
        run: |
          VER="${GITHUB_SHA::8}"
          sed -i "s/__BUILD_VERSION__/$VER/g" index.html app.js sw.js
      - name: Stamp cross-device sync proxy URL
        # VOCAB_SYNC_PROXY_URL is a plain repository *variable* (Settings ->
        # Secrets and variables -> Actions -> Variables), not a Secret - it
        # ends up in this public static bundle either way (see sync.js), so
        # there is nothing to protect by hiding it. Left unset, this
        # substitutes the empty string, which sync.js's own
        # isSyncProxyConfigured() correctly reads as "sync not configured" -
        # same fallback shape as Orbit's own VITE_ORBIT_SYNC_PROXY_URL.
        run: |
          sed -i "s|__VOCAB_SYNC_PROXY_URL__|${{ vars.VOCAB_SYNC_PROXY_URL }}|g" sync.js
      - name: Stamp AI features (personalized mnemonic / story mode) proxy URL
        # Same reasoning as the sync proxy URL above - VOCAB_AI_PROXY_URL is
        # a plain repository Variable, not a Secret (it ends up in this
        # public static bundle either way, see vocab-ai.js), and left unset
        # substitutes the empty string, which vocab-ai.js's own
        # isVocabAiConfigured() correctly reads as "not configured".
        run: |
          sed -i "s|__VOCAB_AI_PROXY_URL__|${{ vars.VOCAB_AI_PROXY_URL }}|g" vocab-ai.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
